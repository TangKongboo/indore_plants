<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#0f522e"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="logoLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Logo Icon Emblem -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#logoBgGrad)" stroke="#eab308" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M26 42 C19 42 11 35 13 22 C18 20 26 22 26 42 Z" fill="url(#logoLeaf)"/>
    <path d="M26 42 C31 38 39 30 38 17 C31 17 26 25 26 42 Z" fill="url(#logoGold)" filter="url(#logoGlow)"/>
    <path d="M26 43 C25.5 31 25 18 29 10 C27 13 24.5 22 26 43 Z" fill="#ffffff" opacity="0.9"/>
    <circle cx="36" cy="15" r="2" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Brand Typography -->
  <text x="68" y="38" font-family="'Outfit', 'Jost', sans-serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Indore<tspan fill="url(#logoGold)">Plants</tspan>
  </text>
</svg>
