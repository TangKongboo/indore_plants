<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#0f522e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#eab308" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Left Main Leaf (Gold & Emerald blend) -->
  <path d="M32 50 C24 50 14 42 16 26 C22 24 32 26 32 50 Z" fill="url(#leafGrad)" />
  
  <!-- Right Leaf (Glowing Golden Accent) -->
  <path d="M32 50 C38 46 48 36 46 20 C38 20 32 30 32 50 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Center Sprout Shoot -->
  <path d="M32 52 C31.5 38 31 22 36 12 C33 16 30 26 32 52 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Tiny Dewdrop / Sparkle -->
  <circle cx="44" cy="18" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="44" cy="18" r="4.5" fill="#fef08a" opacity="0.3"/>
</svg>
